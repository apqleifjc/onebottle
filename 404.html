<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>페이지를 찾을 수 없어요 | ONE BOTTLE</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <!--
    ▼ 경로 처리 방식
      - 기본은 다른 페이지와 같은 상대 경로(css/style.css, index.html)를 씁니다.
        → WebStorm 미리보기(localhost:63342/onebottle/...), 파일 직접 열기, 실제 서버 모두 OK
      - 실제 서버에서 /abc/def 처럼 깊은 주소로 들어와 CSS를 못 찾으면
        자동으로 사이트 최상위("/") 기준 경로로 바꿔서 다시 불러옵니다.
  -->
  <script>
    function useSiteRoot() {
      var fixLinks = function () {
        var links = document.querySelectorAll('a[href]');
        for (var i = 0; i < links.length; i++) {
          var href = links[i].getAttribute('href');
          if (/^[\w-]+\.html/.test(href)) links[i].setAttribute('href', '/' + href);
        }
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fixLinks);
      else fixLinks();
    }
  </script>
  <link rel="stylesheet" href="css/style.css"
        onerror="this.onerror=null; this.href='/css/style.css'; useSiteRoot();">
</head>
<body>

  <!-- 헤더 -->
  <header class="header">
    <div class="container header__inner">
      <a href="index.html" class="logo">ONE <span>BOTTLE</span></a>

      <input type="checkbox" id="nav-toggle" class="nav-toggle">
      <label for="nav-toggle" class="nav-toggle__label" aria-label="메뉴 열기"><span></span></label>

      <nav class="nav">
        <ul class="nav__list">
          <li class="nav__item"><a href="about.html">소개</a></li>
          <li class="nav__item"><a href="menu.html">메뉴</a></li>
          <li class="nav__item"><a href="notice.html">공지사항</a></li>
          <li class="nav__item"><a href="visit.html">오시는 길</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="error-page">
      <div class="container error-page__inner">
        <div class="error-page__visual" aria-hidden="true">
          <div class="bottle bottle--empty">
            <div class="bottle__cap"></div>
            <div class="bottle__neck"></div>
            <div class="bottle__body">
              <div class="bottle__liquid"></div>
              <div class="bottle__label"><strong id="error-code">404</strong><span>EMPTY</span></div>
            </div>
          </div>
        </div>

        <div class="error-page__text">
          <p class="eyebrow" id="error-eyebrow">Page Not Found</p>
          <h1 id="error-title">앗, 병이 비어 있어요</h1>
          <p class="error-page__desc" id="error-desc">
            찾으시는 페이지가 없거나 주소가 바뀌었어요.<br>
            아래 버튼으로 다시 둘러봐 주세요.
          </p>
          <div class="error-page__buttons">
            <a href="index.html" class="btn btn--primary">홈으로 가기</a>
            <a href="menu.html" class="btn btn--ghost">메뉴 보기</a>
          </div>
          <p class="error-page__help">
            문제가 계속되면 <a href="tel:031-471-3271">031-471-3271</a>로 알려주세요.
          </p>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <a href="index.html" class="logo logo--light">ONE <span>BOTTLE</span></a>
      <p>&copy; 2026 ONE BOTTLE. All rights reserved.</p>
    </div>
  </footer>

  <!-- 다른 페이지에서 오류로 넘어온 경우(?error=...) 문구를 바꿔서 보여줌 -->
  <script>
    try {
      if (new URLSearchParams(location.search).has('error')) {
        document.title = '일시적인 오류 | ONE BOTTLE';
        document.getElementById('error-code').textContent = 'OOPS';
        document.getElementById('error-eyebrow').textContent = 'Something Went Wrong';
        document.getElementById('error-title').textContent = '잠시 문제가 생겼어요';
        document.getElementById('error-desc').innerHTML =
          '페이지를 불러오는 중 예기치 않은 오류가 발생했어요.<br>잠시 후 다시 시도해 주세요.';
      }
    } catch (e) {}
  </script>
</body>
</html>
